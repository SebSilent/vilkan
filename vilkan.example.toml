# Copy to `vilkan.toml` (git-ignored) and point it at YOUR files.
# Every path must be OUTSIDE the repository; the tools refuse otherwise.
# Environment variables (shown below) take precedence over this file.
# VILKAN_CONFIG selects a different config file.

[paths]
# Your own dump of Cuck Simulator Miami.     env: VILKAN_GAME_DIR
game_dir = 'D:\vilkan-data\game'

# Derived data. Default: %LOCALAPPDATA%\vilkan\cache.   env: VILKAN_CACHE_DIR
# cache_dir = 'D:\vilkan-data\cache'

# What titles save (persistent local storage), kept apart from the cache.
# Default: %LOCALAPPDATA%\vilkan\data.   env: VILKAN_DATA_DIR
# data_dir = 'D:\vilkan-data\data'

# Other Xbox Series titles used to test platform-level code.
# env: VILKAN_TEST_TITLES (separated by ';')
test_titles = []
